<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#78b9df"><title>Blocklands — Voxel Sandbox</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="game"></div><div id="loading">BLOCKLANDS <small>Генерируем новый мир…</small></div>
<header class="hud"><div class="logo">BLOCK<span>LANDS</span></div><div class="mode"><button id="survival" class="selected">ВЫЖИВАНИЕ</button><button id="creative">ТВОРЧЕСТВО</button></div><div id="stats">❤ ♥ ♥ ♥ ♥　☀ День 1</div><button id="bag" class="bag">🎒</button></header>
<div id="crosshair">＋</div><div id="target">Исследуй мир · добывай · строй</div>
<div id="hotbar" aria-label="Панель быстрого доступа"></div>
<div id="left-stick"><div id="stick-knob"></div></div>
<div id="actions"><button id="jump">⬆</button><button id="break">⛏</button><button id="place">▣</button></div>
<div id="look-note">Свайп справа — обзор</div>
<section id="inventory" aria-label="Инвентарь"><div class="inventory-head"><div><b>ИНВЕНТАРЬ</b><small>Предметы и блоки</small></div><button id="close-inventory">✕</button></div><div id="inventory-grid"></div><p>Нажми на предмет, чтобы выбрать его.</p></section>
<div id="toast"></div><script type="module" src="./src/main.js"></script></body></html>
